# Настройка Render: по этому файлу он сам создаёт сервис (New -> Blueprint)
services:
  - type: web
    name: ai-analyst
    runtime: python
    plan: free
    rootDir: backend # программа лежит в папке backend
    buildCommand: pip install -r requirements-deploy.txt
    # API на FastAPI; $PORT выдаёт Render
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health # Render проверяет, что сервер жив
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7 # как в нашем venv
      - key: FRONTEND_URL # адрес фронта - только ему разрешены запросы из браузера
        sync: false # значение вписывается в панели Render, когда появится фронт
